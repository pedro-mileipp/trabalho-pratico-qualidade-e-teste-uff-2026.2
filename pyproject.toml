[project]
name = "banco-digital"
version = "0.1.0"
description = "Sistema web de banco digital para a disciplina Qualidade e Teste (UFF 2026.2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "radon>=6.0",
    "ruff>=0.4",
    "selenium>=4.20",
    "webdriver-manager>=4.0",
    "mutmut>=3.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# PLR1730: removeria os `if`s que garantem complexidade ciclomática >= 10 nas classes de domínio
# DTZ005: datetimes naive são intencionais na aplicação
ignore = ["PLR1730", "DTZ005"]