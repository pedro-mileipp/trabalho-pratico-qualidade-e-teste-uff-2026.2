{% extends "base.html" %}
{% block titulo %}Tarifas{% endblock %}
{% block conteudo %}
<div class="cartao">
  <h2>Consulta de Tarifas</h2>
  <form method="post">
    <label for="tipo">Tipo de conta</label>
    <select id="tipo" name="tipo">
      <option value="corrente">Corrente</option>
      <option value="poupanca">Poupança</option>
      <option value="premium">Premium</option>
    </select>
    <label for="saldo">Saldo (R$)</label>
    <input type="number" id="saldo" name="saldo" step="0.01" min="0" value="0">
    <label for="transacoes">Transações no mês</label>
    <input type="number" id="transacoes" name="transacoes" min="0" value="0">
    <label><input type="checkbox" id="pacote" name="pacote"> Possui pacote de serviços</label>
    <button type="submit">Calcular</button>
  </form>
  {% if tarifa is not none %}
    <p id="tarifa-resultado"><strong>Tarifa mensal:</strong> R$ {{ "%.2f"|format(tarifa) }}</p>
  {% endif %}
</div>
{% endblock %}
