{% extends "base.html" %}
{% block titulo %}Login{% endblock %}
{% block conteudo %}
<div class="cartao" style="max-width:400px;margin:auto;">
  <h2>Entrar</h2>
  <form method="post">
    <label>E-mail</label>
    <input type="email" name="email" required>
    <label>Senha</label>
    <input type="password" name="senha" required>
    <button type="submit">Entrar</button>
  </form>
  <p style="margin-top:16px;">Não tem conta? <a href="{{ url_for('auth.registro') }}">Cadastre-se</a></p>
</div>
{% endblock %}
